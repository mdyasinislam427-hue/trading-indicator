<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Most Powerful Indicator - FREE</title><style>body{margin:0;background:#000;color:#fff;font-family:Arial}#chart{height:85vh}.top{padding:10px;text-align:center;background:#111;color:#facc15;font:700 14px Arial}.sig{padding:12px;text-align:center;font:900 20px Arial;border-top:2px solid #222}</style></head><body><div class="top">The Most Powerful Indicator On TradingView - FREE BY YASIN</div><div id="chart"></div><div id="sig" class="sig">SCANNING...</div><script src="https://unpkg.com/lightweight-charts@4.0.1/dist/lightweight-charts.standalone.production.js"></script><script>const chart=LightweightCharts.createChart(document.getElementById('chart'),{layout:{background:{color:'#000'},textColor:'#888'},grid:{vertLines:{color:'#111'},horzLines:{color:'#111'}}});const candles=chart.addCandlestickSeries({upColor:'#26a69a',downColor:'#ef5350'});const emaLine=chart.addLineSeries({color:'#ff9800',lineWidth:2});let data=[],price=1.16620;for(let i=0;i<150;i++){let o=price,c=o+(Math.random()-0.48)*0.0003;data.push({time:Math.floor(Date.now()/1000)-(150-i)*60,open:o,high:Math.max(o,c)+0.0001,low:Math.min(o,c)-0.0001,close:c});price=c;}candles.setData(data);let emaData=[],sum=0;data.forEach((d,i)=>{sum+=d.close;if(i>=49){let ema=sum/50;emaData.push({time:d.time,value:ema});sum-=data[i-49].close;}});emaLine.setData(emaData);data.forEach((d,i)=>{if(i<50)return;let ema=emaData[i-49]?.value;if(!ema)return;if(d.close>ema && d.close>d.open && Math.random()>0.85){candles.createPriceLine({price:d.low-0.00015,color:'#22c55e',lineWidth:1,lineStyle:2,axisLabelVisible:false,title:'BUY ▲'});}if(d.close<ema && d.close<d.open && Math.random()>0.85){candles.createPriceLine({price:d.high+0.00015,color:'#ef4444',lineWidth:1,lineStyle:2,axisLabelVisible:false,title:'SELL ▼'});}});setInterval(()=>{let last=data[data.length-1],close=last.close+(Math.random()-0.5)*0.0002,nc={time:Math.floor(Date.now()/1000),open:last.close,high:Math.max(last.close,close)+0.0001,low:Math.min(last.close,close)-0.0001,close};candles.update(nc);let s=document.getElementById('sig');if(close>emaData[emaData.length-1].value)s.innerHTML='<span style="color:#22c55e">▲ BUY SIGNAL</span>';else s.innerHTML='<span style="color:#ef4444">▼ SELL SIGNAL</span>';},1500);</script></body></html>
